image: fedora:latest

stages:
  - test

variables:
  GIT_DEPTH: "1"
  # See README.md: under ptrace-restricted environments (containers,
  # including GitLab's own runners), LeakSanitizer needs disabling or ASan
  # startup fails outright.
  ASAN_OPTIONS: detect_leaks=0

test-all:
  stage: test
  timeout: 1h
  before_script:
    - dnf install -y gcc clang make git diffutils findutils compiler-rt libasan libubsan libtsan openssl-devel sqlite-devel bc nmap-ncat openssl
  script:
    - make test-all
