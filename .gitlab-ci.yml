image: fedora:latest

stages:
  - test

variables:
  GIT_DEPTH: "1"
  # See README.md: under ptrace-restricted environments (containers,
  # including GitLab's own runners), LeakSanitizer needs disabling or ASan
  # startup fails outright.
  ASAN_OPTIONS: detect_leaks=0

test-all:
  stage: test
  timeout: 1h
  before_script:
    - dnf install -y gcc clang make git diffutils findutils compiler-rt libasan libubsan libtsan openssl-devel sqlite-devel bc nmap-ncat openssl
    # diamond's Makefile expects a sibling ../reginold checkout with a
    # built libreginold.a -- reginold is its own private GitLab project,
    # cloned here with a read-only project access token
    # (REGINOLD_READ_TOKEN, a masked CI/CD variable) rather than vendored
    # into this repo, so its own history/versioning stays independent.
    - git clone --depth 1 "https://gitlab-ci-token:${REGINOLD_READ_TOKEN}@gitlab.com/dmn9180/reginold.git" ../reginold
    - make -C ../reginold libreginold.a
  script:
    - make test-all
