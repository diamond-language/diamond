name: release

# Pushing a vX.Y.Z tag builds the .deb, the .rpms (Fedora 44 and 45) and the tarball from
# the tagged tree on x86-64 and on arm64 hardware, installs each into a clean container and
# smoke-tests it (packaging/ci.sh). Then it creates the GitHub release with every package
# attached and the changelog section as its notes. Nothing is published unless
# every package passed. The portable static tools (tools/build_portable.sh) are
# built and tested by ci.yml but not attached until their limits are resolved. A
# release is only tagged after the PR run for the same tree passed, so this
# workflow does not repeat the test matrix.
# workflow_dispatch reruns it for an existing tag; the tag must contain
# packaging/ (0.20 and later).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.20.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        package:
          - {format: deb, image: 'ubuntu:26.04', name: deb}
          - {format: rpm, image: 'fedora:44', name: rpm-fc44}
          - {format: rpm, image: 'fedora:45', name: rpm-fc45}
          - {format: tar, image: '', name: tar}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
      - name: Build, install and smoke-test the ${{ matrix.package.name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/ci.sh ${{ matrix.package.format }} ${{ matrix.package.image }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.package.name }}-${{ matrix.runner }}
          path: build/packages/${{ matrix.package.format }}/*.${{ matrix.package.format == 'tar' && 'tar.gz' || matrix.package.format }}
          if-no-files-found: error

  vscode:
    # The VS Code extension (editors/vscode) as a .vsix attached to the release, and published
    # to the Visual Studio Marketplace, and to Open VSX when OVSX_PAT is configured. The
    # Marketplace step authenticates by trusted publishing (GitHub OIDC): the rolld6 publisher
    # has a policy for this repository and release.yml, so there is no token to store. The
    # extension is versioned on its own (editors/vscode/package.json), so a release that does
    # not bump it skips the stores (--skip-duplicate) and only attaches the file.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # vsce 4 needs Node 22 or later
      - name: Package the extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@4.1.0 package --out ../../d6-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode
          path: d6-vscode.vsix
          if-no-files-found: error
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath d6-vscode.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.3.0 publish d6-vscode.vsix --pat "$OVSX_PAT" --skip-duplicate

  publish:
    needs: [package, vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Creating the release and uploading its files is the only write.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: packages
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish_release.sh "$TAG" packages/*.deb packages/*.rpm packages/*.tar.gz packages/*.vsix
