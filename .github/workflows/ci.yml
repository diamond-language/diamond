name: test

on:
  push:
  pull_request:

env:
  # See README.md: under ptrace-restricted environments (containers,
  # including GitHub's own runners), LeakSanitizer needs disabling or ASan
  # startup fails outright.
  ASAN_OPTIONS: detect_leaks=0

jobs:
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: dnf install -y gcc clang make git diffutils findutils compiler-rt libasan libubsan libtsan openssl-devel sqlite-devel libpq-devel mariadb-connector-c-devel libxcrypt-devel bc nmap-ncat openssl
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: make test-all
        run: make test-all
