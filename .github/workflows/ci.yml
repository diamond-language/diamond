name: test

on:
  push:
  pull_request:

env:
  # See README.md: under ptrace-restricted environments (containers,
  # including GitHub's own runners), LeakSanitizer needs disabling or ASan
  # startup fails outright.
  ASAN_OPTIONS: detect_leaks=0

jobs:
  # Full matrix across both distros this project is known to be deployed on
  # (Fedora dev machine, Ubuntu 26.04 production) and both supported
  # compilers (GCC, and Clang -- previously exercised only incidentally via
  # the fuzz targets, never actually built/tested as a real CC=clang build
  # until a firsthand Ubuntu 26.04 + Clang pass surfaced three real bugs:
  # see CHANGELOG.md). fail-fast: false so one combination's failure
  # doesn't hide results from the other three.
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        os:
          - name: fedora
            container: fedora:latest
          - name: ubuntu
            container: ubuntu:26.04
    # options: --init: without a real init process reaping them, orphaned
    # zombie children from other tests accumulate for the rest of the job
    # -- confirmed directly (Process.spawn's own zombie-reaping test false-
    # failed on both Ubuntu jobs the first time this matrix ran in real CI:
    # "Process.spawn left zombie processes behind after GC sweep" against
    # zombies from an *earlier*, unrelated test, not its own).
    container:
      image: ${{ matrix.os.container }}
      options: --init
    steps:
      # Diagnostic for the still-unexplained test-sanitize flake (fails
      # silently, roughly half of real runs, on both distros/compilers,
      # never once locally on a real non-container Linux box) -- ASan's
      # shadow-memory mapping is sensitive to host-kernel ASLR entropy
      # (mmap_rnd_bits), and this container shares whatever kernel the
      # actual GitHub Actions runner VM boots, not anything pinned by
      # the fedora:latest/ubuntu:26.04 image itself. Confirmed the local
      # baseline to compare this against directly: a real (non-container)
      # Fedora 44 desktop reports mmap_rnd_bits=28, ptrace_scope=0.
      - name: Diagnostic environment facts (test-sanitize flake investigation)
        run: |
          echo "=== uname ==="; uname -a
          echo "=== mmap_rnd_bits ==="; cat /proc/sys/vm/mmap_rnd_bits 2>&1 || echo "(unreadable)"
          echo "=== mmap_rnd_compat_bits ==="; cat /proc/sys/vm/mmap_rnd_compat_bits 2>&1 || echo "(unreadable)"
          echo "=== randomize_va_space ==="; cat /proc/sys/kernel/randomize_va_space 2>&1 || echo "(unreadable)"
          echo "=== ptrace_scope ==="; cat /proc/sys/kernel/yama/ptrace_scope 2>&1 || echo "(not present)"
          echo "=== ulimits ==="; ulimit -a
          echo "=== cgroup fs type ==="; stat -fc %T /sys/fs/cgroup 2>&1 || echo "(unreadable)"
          echo "=== cgroup ==="; cat /proc/self/cgroup 2>&1
          echo "=== nproc/mem ==="; nproc; free -h 2>&1 || cat /proc/meminfo 2>&1 | head -3
          echo "=== id ==="; id
      - name: Install dependencies (Fedora)
        if: matrix.os.name == 'fedora'
        run: dnf install -y gcc clang make git diffutils findutils ripgrep compiler-rt libasan libubsan libtsan openssl-devel sqlite-devel libpq-devel mariadb-connector-c-devel libxcrypt-devel bc nmap-ncat openssl
      - name: Install dependencies (Ubuntu)
        if: matrix.os.name == 'ubuntu'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc clang make git diffutils findutils ripgrep libssl-dev libsqlite3-dev libpq-dev zlib1g-dev libmariadb-dev libcrypt-dev bc netcat-openbsd openssl
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: make test-all
        run: make CC=${{ matrix.cc }} test-all
