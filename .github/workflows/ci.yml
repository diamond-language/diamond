name: test

on:
  push:
  pull_request:

env:
  # See README.md: under ptrace-restricted environments (containers,
  # including GitHub's own runners), LeakSanitizer needs disabling or ASan
  # startup fails outright.
  ASAN_OPTIONS: detect_leaks=0

jobs:
  # Full matrix across both distros this project is known to be deployed on
  # (Fedora dev machine, Ubuntu 26.04 production) and both supported
  # compilers (GCC, and Clang -- previously exercised only incidentally via
  # the fuzz targets, never actually built/tested as a real CC=clang build
  # until a firsthand Ubuntu 26.04 + Clang pass surfaced three real bugs:
  # see CHANGELOG.md). fail-fast: false so one combination's failure
  # doesn't hide results from the other three.
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        os:
          - name: fedora
            container: fedora:latest
          - name: ubuntu
            container: ubuntu:26.04
    # options: --init: without a real init process reaping them, orphaned
    # zombie children from other tests accumulate for the rest of the job
    # -- confirmed directly (Process.spawn's own zombie-reaping test false-
    # failed on both Ubuntu jobs the first time this matrix ran in real CI:
    # "Process.spawn left zombie processes behind after GC sweep" against
    # zombies from an *earlier*, unrelated test, not its own).
    container:
      image: ${{ matrix.os.container }}
      options: --init
    steps:
      # Diagnostic for the still-unexplained test-sanitize flake (fails
      # silently, roughly half of real runs, on both distros/compilers,
      # never once locally on a real non-container Linux box) -- ASan's
      # shadow-memory mapping is sensitive to host-kernel ASLR entropy
      # (mmap_rnd_bits), and this container shares whatever kernel the
      # actual GitHub Actions runner VM boots, not anything pinned by
      # the fedora:latest/ubuntu:26.04 image itself. Confirmed the local
      # baseline to compare this against directly: a real (non-container)
      # Fedora 44 desktop reports mmap_rnd_bits=28, ptrace_scope=0.
      - name: Diagnostic environment facts (test-sanitize flake investigation)
        run: |
          echo "=== uname ==="; uname -a
          echo "=== mmap_rnd_bits ==="; cat /proc/sys/vm/mmap_rnd_bits 2>&1 || echo "(unreadable)"
          echo "=== mmap_rnd_compat_bits ==="; cat /proc/sys/vm/mmap_rnd_compat_bits 2>&1 || echo "(unreadable)"
          echo "=== randomize_va_space ==="; cat /proc/sys/kernel/randomize_va_space 2>&1 || echo "(unreadable)"
          echo "=== ptrace_scope ==="; cat /proc/sys/kernel/yama/ptrace_scope 2>&1 || echo "(not present)"
          echo "=== ulimits ==="; ulimit -a
          echo "=== cgroup fs type ==="; stat -fc %T /sys/fs/cgroup 2>&1 || echo "(unreadable)"
          echo "=== cgroup ==="; cat /proc/self/cgroup 2>&1
          echo "=== nproc/mem ==="; nproc; free -h 2>&1 || cat /proc/meminfo 2>&1 | head -3
          echo "=== id ==="; id
      - name: Install dependencies (Fedora)
        if: matrix.os.name == 'fedora'
        run: dnf install -y gcc clang make git diffutils findutils ripgrep compiler-rt libasan libubsan libtsan openssl-devel sqlite-devel libpq-devel mariadb-connector-c-devel libxcrypt-devel bc nmap-ncat openssl
      - name: Install dependencies (Ubuntu)
        if: matrix.os.name == 'ubuntu'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc clang make git diffutils findutils ripgrep libssl-dev libsqlite3-dev libpq-dev zlib1g-dev libmariadb-dev libcrypt-dev bc netcat-openbsd openssl
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: make test-all
        run: make CC=${{ matrix.cc }} test-all

  # A third, genuinely different target -- musl, not just another distro
  # (fedora/ubuntu above are both glibc). Its own job, not another
  # matrix.os entry above: needs a different package manager, an extra
  # link dependency (-lucontext), GCC only (never validated against
  # musl+Clang), and a narrower set of test targets -- test-all itself
  # runs sanitizer/tsan builds and every package-specific test (database,
  # HTTP, GraphQL, ...) that this validation has not actually checked
  # against musl, so claiming that coverage here would be dishonest, not
  # just broader. See docs/portability.md for the full inventory of what
  # building and testing against musl actually required.
  test-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: alpine:edge
      options: --init # see test-all's own identical comment above
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install dependencies (Alpine)
        run: |
          apk update
          apk add --no-cache gcc musl-dev make git diffutils findutils \
            ripgrep bc netcat-openbsd openssl openssl-dev sqlite-dev \
            libpq-dev mariadb-connector-c-dev zlib-dev libucontext \
            libucontext-dev tzdata bash coreutils procps sed gawk
      # BCrypt.hash has no bcrypt algorithm to call into on musl at all
      # (docs/portability.md) -- a real, documented libc limitation, not
      # a bug, so every case exercising it is excluded here rather than
      # left to fail the corpus run (tests/run_cases.c's own case loop
      # stops at the first failure -- `grep -rl 'BCrypt\.' tests/cases/
      # *.di` is what actually found both of these, not trial and error
      # one case at a time). Moved aside rather than deleted only so the
      # exclusion is visibly reversible in this step's own log; the
      # container itself is discarded once the job ends either way.
      - name: Exclude the known BCrypt/musl limitation
        run: |
          mkdir -p /tmp/excluded-cases
          mv tests/cases/active_record_secure_password.di \
             tests/cases/active_record_secure_password.expected \
             tests/cases/bcrypt.di \
             tests/cases/bcrypt.expected \
             /tmp/excluded-cases/
      - name: make test (musl)
        run: make CC=gcc LDLIBS_EXTRA=-lucontext test
      - name: Focused test targets (musl)
        run: |
          make CC=gcc LDLIBS_EXTRA=-lucontext test-api
          make CC=gcc LDLIBS_EXTRA=-lucontext test-incremental-compile
          make CC=gcc LDLIBS_EXTRA=-lucontext test-compiled-prelude
          make CC=gcc LDLIBS_EXTRA=-lucontext test-fibers
          make CC=gcc LDLIBS_EXTRA=-lucontext test-fiber-run
          make CC=gcc LDLIBS_EXTRA=-lucontext test-lsp
          make CC=gcc LDLIBS_EXTRA=-lucontext test-repl

  # A fourth genuinely different target -- a real BSD kernel/libc, not a
  # Linux one at all. Confirmed viable first via a one-off diagnostic VM
  # boot before writing this (docs/portability.md's "FreeBSD/OpenBSD"
  # section): ucontext/makecontext/swapcontext, crypt(3) bcrypt, and -ldl
  # all work natively here, and the base install already ships
  # nproc/timeout/bc (OpenBSD, checked the same way, is not attempted --
  # it has no <ucontext.h> at all, a Fiber-implementation gap, not a CI
  # one). CC=clang, not gcc: FreeBSD's base `cc` already is Clang 19, so
  # this avoids an extra ports build just to get gcc. Narrower target set
  # than test-all, same reasoning as test-musl's own comment above: this
  # validation hasn't touched sanitizer/tsan builds or the package-
  # specific suites (database, HTTP, GraphQL, ...) against FreeBSD, so
  # claiming that coverage here would be dishonest.
  test-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: FreeBSD build and test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake bash ripgrep gsed sqlite3 openssl postgresql16-client mariadb-connector-c
          # FreeBSD's base `make` is BSD make (pmake), not GNU Make -- this
          # Makefile uses GNU-only syntax throughout (ifeq, $(wildcard ...),
          # $(shell ...)), so it needs invoking as `gmake` specifically, the
          # standard FreeBSD convention (`make` itself stays bound to the
          # base BSD one). Confirmed directly: the first real run here
          # failed immediately with pmake's own "Invalid character" parse
          # errors on every GNU Make construct in the file.
          # CPPFLAGS_EXTRA/LDFLAGS_EXTRA are each one quoted argument per
          # invocation below, not a $VAR-expanded, word-split string: both
          # carry two paths -- mariadb-connector-c's FreeBSD port namespaces
          # its own mysql.h under /usr/local/include/mariadb/ and
          # libmariadb.so under /usr/local/lib/mariadb/, on top of the
          # plain /usr/local prefix everything else (sqlite3, libpq) needs
          # (confirmed directly via a diagnostic `find` in an earlier
          # iteration -- same split Debian/Ubuntu's libmariadb-dev needs on
          # Linux, see Makefile's own CPPFLAGS comment). An unquoted
          # multi-word value here would fall apart into separate shell
          # words, one of which (a bare -I.../mariadb or -L.../mariadb has
          # no `=`) make would misparse as its own flag rather than part of
          # the variable.
          # tests/collection_relay_contracts.sh (run by tests/run.sh) uses a
          # GNU sed extension (a :label/n/p/b loop) FreeBSD's base BSD sed
          # rejects outright ("unexpected EOF (pending }'s)") -- confirmed
          # directly, same category as musl/Alpine's own documented BusyBox
          # sed finding (docs/portability.md). FreeBSD's own GNU sed port
          # installs as `gsed`, not a `sed` override, and /usr/local/bin
          # sits *after* /usr/bin in FreeBSD's default PATH -- so a plain
          # package install wouldn't shadow the base sed the way Alpine's
          # apk package does. Prepending an explicit symlink directory is
          # deterministic either way, not dependent on that PATH ordering.
          # BCrypt.hash needs libxcrypt's crypt_gensalt_rn/
          # CRYPT_GENSALT_IMPLEMENTS_AUTO_ENTROPY (src/vm.c) to generate a
          # fresh salt -- both declared only in libxcrypt's own <crypt.h>,
          # which doesn't exist on FreeBSD at all (see the __has_include
          # guard added for FreeBSD earlier), so bcrypt_hash_helper always
          # takes its #else "not supported on this platform" branch here,
          # exactly like musl (a different missing piece -- musl has
          # <crypt.h> but not bcrypt algorithm support in crypt_r itself --
          # same observable gap). BCrypt.verify is unaffected (no salt
          # generation involved, just crypt_r against an existing digest --
          # confirmed genuinely native and correct on FreeBSD via the
          # earlier diagnostic probe). Same two cases test-musl's own job
          # already excludes, same reason category, confirmed directly by
          # a real failing run here: "expected exit code 0, got: 70".
          run: |
            set -e
            mkdir -p /tmp/excluded-cases
            mv tests/cases/active_record_secure_password.di \
               tests/cases/active_record_secure_password.expected \
               tests/cases/bcrypt.di \
               tests/cases/bcrypt.expected \
               /tmp/excluded-cases/
            mkdir -p /tmp/gnubin
            ln -sf "$(which gsed)" /tmp/gnubin/sed
            export PATH="/tmp/gnubin:$PATH"
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test-api
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test-incremental-compile
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test-compiled-prelude
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test-fibers
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test-fiber-run
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test-lsp
            gmake CC=clang CPPFLAGS_EXTRA='-I/usr/local/include -I/usr/local/include/mariadb' LDFLAGS_EXTRA='-L/usr/local/lib -L/usr/local/lib/mariadb' test-repl
