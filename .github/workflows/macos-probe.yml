name: macos-probe

# Manually-triggered only (workflow_dispatch), not part of the push/PR
# matrix in ci.yml. Same reasoning as the (now-deleted) bsd-probe.yml that
# preceded the real FreeBSD CI job: find out what's actually true on a
# real GitHub-hosted macos-* runner before writing tests/run.sh fixes or a
# real test-macos job against assumptions (docs/portability.md's own
# "macOS/Darwin" section was explicit that none of its own findings were
# checked against real hardware yet). Delete this workflow once its
# findings are written up and either acted on or explicitly deferred.

on:
  workflow_dispatch:

jobs:
  probe-macos-vm-compile:
    # Targeted verification for the _XOPEN_SOURCE/__BSD_VISIBLE fix
    # (macos-ucontext-fix branch): compile src/vm.c alone (-c, no link) --
    # every symbol that fix touches or could regress (ucontext.h,
    # MAP_ANONYMOUS, SO_REUSEPORT, crypt_r/struct crypt_data) lives there,
    # so this is sufficient to confirm the fix without needing a full
    # link (which would need postgres/mariadb-connector-c brew packages
    # not yet worked out for macOS). Delete this job once the fix is
    # confirmed and merged.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install dependencies (Homebrew)
        run: brew install postgresql@16 mariadb-connector-c
      - name: Compile src/vm.c with the real project headers
        run: |
          cc -std=c23 -Isrc -Ilsp -Ireginold \
            -I$(brew --prefix openssl@3)/include -I$(brew --prefix sqlite)/include \
            -I$(brew --prefix postgresql@16)/include \
            -I$(brew --prefix mariadb-connector-c)/include \
            -I$(brew --prefix mariadb-connector-c)/include/mariadb \
            -c src/vm.c -o /tmp/vm.o 2>&1
          echo "=== vm.c compiled cleanly ==="

  probe-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: macOS probe
        run: |
          echo "=== uname -a ==="; uname -a
          echo "=== uname -m ==="; uname -m
          echo "=== sw_vers ==="; sw_vers 2>&1 || true
          echo "=== default shell for 'bash script' invocation ==="
          which bash; bash --version | head -1
          echo "=== /bin/bash (system) ==="
          /bin/bash --version | head -1
          echo "=== timeout ==="
          which timeout || echo "NO TIMEOUT"
          echo "=== gtimeout (coreutils) ==="
          which gtimeout || echo "NO GTIMEOUT (not installed by default)"
          brew list coreutils >/dev/null 2>&1 && echo "coreutils preinstalled" || echo "coreutils NOT preinstalled"
          echo "=== nproc ==="
          which nproc || echo "NO NPROC"
          echo "=== sysctl -n hw.ncpu ==="
          sysctl -n hw.ncpu
          echo "=== getconf _NPROCESSORS_ONLN ==="
          getconf _NPROCESSORS_ONLN || echo "getconf _NPROCESSORS_ONLN FAILED"
          echo "=== bc ==="
          which bc || echo "NO BC"
          echo "1+1" | bc 2>&1 || echo "BC FAILED"
          echo "=== sed ==="
          which sed; sed --version 2>&1 | head -1 || echo "(BSD sed, no --version)"
          echo "=== gsed (coreutils/gnu-sed) ==="
          which gsed || echo "NO GSED (not installed by default)"
          echo "=== EPOCHREALTIME under system bash ==="
          /bin/bash -c 'echo "system bash EPOCHREALTIME=${EPOCHREALTIME:-UNSET}"'
          echo "=== EPOCHREALTIME under bash resolved from PATH ==="
          bash -c 'echo "PATH-resolved bash EPOCHREALTIME=${EPOCHREALTIME:-UNSET}"'
          echo "=== homebrew prefix ==="
          brew --prefix 2>&1 || echo "NO BREW"
          echo "=== ucontext probe (with the _XOPEN_SOURCE fix just landed) ==="
          cat > /tmp/ctx_probe.c <<'EOF'
          #define _XOPEN_SOURCE 700
          #include <ucontext.h>
          #include <stdio.h>
          static ucontext_t a, b;
          static void f(void) { printf("ucontext OK\n"); }
          int main(void) {
          char stack[65536];
          getcontext(&a);
          a.uc_stack.ss_sp = stack;
          a.uc_stack.ss_size = sizeof(stack);
          a.uc_link = &b;
          makecontext(&a, f, 0);
          swapcontext(&b, &a);
          return 0;
          }
          EOF
          cc /tmp/ctx_probe.c -o /tmp/ctx_probe 2>&1 && /tmp/ctx_probe || echo "UCONTEXT PROBE FAILED"
          echo "=== crypt(3) bcrypt probe ==="
          cat > /tmp/crypt_probe.c <<'EOF'
          #include <unistd.h>
          #include <stdio.h>
          int main(void) {
          char *hash = crypt("password", "$2b$04$N9qo8uLOickgx2ZMRZoMye");
          printf("crypt result: %s\n", hash ? hash : "(null)");
          return 0;
          }
          EOF
          cc /tmp/crypt_probe.c -o /tmp/crypt_probe 2>&1 && /tmp/crypt_probe || echo "CRYPT PROBE FAILED (link or run)"
          echo "=== -ldl probe ==="
          cat > /tmp/dl_probe.c <<'EOF'
          #include <dlfcn.h>
          int main(void) { dlopen("nonexistent.so", RTLD_LAZY); return 0; }
          EOF
          cc /tmp/dl_probe.c -o /tmp/dl_probe -ldl 2>&1 && echo "LDL LINKS OK" || echo "LDL LINK FAILED"
          echo "=== -lcrypt probe ==="
          cc /tmp/crypt_probe.c -o /tmp/crypt_probe2 -lcrypt 2>&1 && echo "LCRYPT LINKS OK" || echo "LCRYPT LINK FAILED"
          echo "=== openssl/sqlite3/libpq/mariadb via brew ==="
          brew list openssl@3 >/dev/null 2>&1 && echo "openssl@3 preinstalled" || echo "openssl@3 not preinstalled"
          brew list sqlite >/dev/null 2>&1 && echo "sqlite preinstalled" || echo "sqlite not preinstalled"
          echo "=== done ==="
